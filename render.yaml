# Render Blueprint — see docs/CLOUD_DEPLOYMENT.md for the full walkthrough.
#
# One web service (this Dockerfile) + one managed Postgres database.
# There is no separate worker/background-job service: the autonomous
# scheduler runs in-process inside `job-agent serve` (see
# src/job_agent/jobs/scheduler.py) and needs nothing else.
#
# After connecting this repo on https://dashboard.render.com/blueprints,
# Render reads this file and provisions both resources. Everything under
# `envVars` with `sync: false` must be filled in by hand in the Render
# dashboard after the first deploy — never commit real values here.

# This is the PAID recipe (~$14/mo total) — the most robust option:
# always-on web service, database that never expires, scheduler runs on
# schedule with no extra moving parts. See render.free.yaml (and
# docs/CLOUD_DEPLOYMENT.md's "Free-tier alternative" section) for a
# genuinely $0/month recipe using Render's free web service + a free
# Neon.tech Postgres + a free external keep-alive ping — the tradeoff
# being one more account to set up and a small chance of a missed
# scheduler tick if the keep-alive ever lapses (never a duplicate run or
# lost data either way, since the due-check is based on real elapsed
# time stored in the database, not process uptime).
databases:
  - name: career-os-db
    databaseName: career_os
    plan: starter

services:
  - type: web
    name: career-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      # Provided automatically by Render from the database above — do not
      # set this by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: career-os-db
          property: connectionString

      # Safety-critical: submission stays impossible until you deliberately
      # change both. Leave as-is unless you mean it (see README.md).
      - key: DRY_RUN
        value: "true"
      - key: LIVE_MODE
        value: "false"

      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"

      # Fill in after the first deploy, in the Render dashboard (Environment
      # tab) — never commit real values. Both required together: this is a
      # personal single-candidate dashboard and must not be reachable by an
      # anonymous visitor once it has a public URL (see docs/CLOUD_DEPLOYMENT.md
      # step 8's security note).
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false

      # Optional — leave unset for deterministic-only matching/tailoring.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "anthropic"

      # Optional — leave unset to skip the Adzuna source (Remotive/
      # Arbeitnow need no credentials and work without these).
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
