[project]
name = "instacore-sync"
version = "1.0.0"
description = "Production-grade Windows desktop app that automates WhatsApp Instacore video ingestion into Google Drive/Sheets"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Career Ops Intel" }]

dependencies = [
    "PySide6>=6.7,<7.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "watchdog>=4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "pytesseract>=0.3.10",
    "paddleocr>=2.8; platform_machine != 'arm64'",
    "paddlepaddle>=2.6; platform_machine != 'arm64'",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "tenacity>=8.5",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "qtawesome>=1.3",
    "psutil>=6.0",
    "cryptography>=42.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
instacore-sync = "instacore_sync.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
