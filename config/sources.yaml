# =============================================================================
# sources.yaml — Job source adapter configuration (Phase 2+)
# =============================================================================
# Phase 1 does not implement any job source adapter. This file defines the
# configuration shape the JobSource plugin architecture (Phase 2) will read,
# so config and code evolve together instead of being retrofitted.
#
# `enabled: false` everywhere until a source's adapter is implemented AND
# verified to respect that platform's robots.txt / terms of use / official
# API. Never flip a source to enabled without that verification.
# =============================================================================

sources:
  greenhouse:
    enabled: false
    kind: "ats_api"
    poll_interval_minutes: 10
    rate_limit_per_minute: 20
    notes: "Public job-board JSON API per-company; no auth needed for reads."
    # Each entry polls https://boards-api.greenhouse.io/v1/boards/{token}/jobs.
    # `token` is the company's Greenhouse board token (found in their careers
    # page URL, e.g. boards.greenhouse.io/<token>) and `company_name` is
    # supplied explicitly rather than inferred. PLACEHOLDER — this sandbox's
    # network policy blocks outbound calls to boards-api.greenhouse.io, so
    # these could not be live-verified from here. Confirm real board tokens
    # (visit the company's careers page) before enabling.
    boards:
      - token: "REPLACE_WITH_REAL_GREENHOUSE_BOARD_TOKEN"
        company_name: "REPLACE_WITH_COMPANY_NAME"

  lever:
    enabled: false
    kind: "ats_api"
    poll_interval_minutes: 10
    rate_limit_per_minute: 20
    notes: "Public postings API per-company."
    # Each entry polls https://api.lever.co/v0/postings/{token}?mode=json.
    # `token` is the company's Lever slug. Same PLACEHOLDER caveat as above —
    # api.lever.co is also not reachable from this sandbox to verify.
    boards:
      - token: "REPLACE_WITH_REAL_LEVER_COMPANY_SLUG"
        company_name: "REPLACE_WITH_COMPANY_NAME"

  remotive:
    enabled: true
    kind: "search_api"
    poll_interval_minutes: 60
    rate_limit_per_minute: 10
    max_queries: 3
    notes: >-
      Public, keyless remote-jobs API (https://remotive.com/api/remote-jobs)
      — no ToS concern, no credential needed. Searches the candidate's own
      generated query portfolio (job_agent.jobs.query_generator), up to
      max_queries terms per scan. Enabled 2026-09-04 (real-world activation
      audit): the adapter is implemented and tested; this sandbox's network
      policy blocks outbound calls to remotive.com so it could not be
      live-verified from here — it will start returning real jobs the
      moment `job-agent jobs search-run` runs somewhere with network access
      to remotive.com. No further action needed from the candidate.

  arbeitnow:
    enabled: true
    kind: "search_api"
    poll_interval_minutes: 60
    rate_limit_per_minute: 10
    notes: >-
      Public, keyless job-board API
      (https://www.arbeitnow.com/api/job-board-api) — no ToS concern, no
      credential needed, lists every current posting (no search term
      supported by the API itself). Reports a real visa_sponsorship flag
      per listing when the source states it. Enabled 2026-09-04 (real-world
      activation audit): the adapter is implemented and tested; this
      sandbox's network policy blocks outbound calls to arbeitnow.com so it
      could not be live-verified from here — it will start returning real
      jobs the moment a real run has network access to arbeitnow.com. No
      further action needed from the candidate.

  adzuna:
    enabled: true
    kind: "search_api"
    poll_interval_minutes: 60
    rate_limit_per_minute: 10
    max_queries: 2
    # ISO 3166-1 alpha-2 codes Adzuna supports, drawn from the candidate's
    # requested country list: gb=UK, us=USA, ca=Canada, in=India,
    # sg=Singapore, au=Australia, de=Germany, nl=Netherlands. Ireland and
    # UAE are not Adzuna markets as of this writing — omitted rather than
    # faked (Remotive/Arbeitnow above cover global/remote roles instead).
    countries: ["gb", "us", "ca", "in", "sg", "au", "de", "nl"]
    notes: >-
      Official Adzuna Jobs API (https://developer.adzuna.com/) — requires
      a free ADZUNA_APP_ID/ADZUNA_APP_KEY (see .env.example); skipped with
      a logged reason if unset even when enabled here, never a crash and
      never fake data. Enabled 2026-09-04 (real-world activation audit) so
      it activates the instant credentials are set — but it is genuinely
      NOT live yet: get free credentials at https://developer.adzuna.com/,
      set ADZUNA_APP_ID/ADZUNA_APP_KEY in `.env`, and this sandbox's network
      policy also blocks api.adzuna.com so connectivity could not be
      live-verified from here either.

  workday:
    enabled: false
    kind: "ats_api"
    poll_interval_minutes: 15
    rate_limit_per_minute: 10
    notes: "Varies per tenant; some expose a CXS JSON endpoint."

  company_career_pages:
    enabled: false
    kind: "scrape"
    poll_interval_minutes: 30
    rate_limit_per_minute: 5
    notes: "Must respect robots.txt per-domain; structured data (JSON-LD JobPosting) preferred over HTML scraping."

  linkedin:
    enabled: false
    kind: "restricted"
    notes: "LinkedIn's ToS restricts automated scraping/application. Do not enable without an approved, compliant integration (e.g. official API/partner access)."

  indeed:
    enabled: false
    kind: "restricted"
    notes: "Requires reviewing current API/partner terms before enabling."

  wellfound:
    enabled: false
    kind: "restricted"
    notes: "Requires reviewing current API/terms before enabling."

  yc_jobs:
    enabled: false
    kind: "scrape"
    poll_interval_minutes: 30
    rate_limit_per_minute: 10
    notes: "Work Y Combinator jobs board; verify robots.txt before enabling."

global_limits:
  max_concurrent_sources: 3
  default_backoff_seconds: 5
  default_backoff_multiplier: 2.0
  default_backoff_max_seconds: 300
  max_retries_per_request: 3
