# =============================================================================
# automation.yaml — Automation level, thresholds, safety switches
# =============================================================================

automation:
  # 0=discovery only, 1=+score, 2=+prepare, 3=+fill+human approval,
  # 4=auto-submit safe applications. See BUILD PROMPT section 18.
  level: 3
  mode: "human_approval"

# Master safety switches. Both must be true for anything to ever be
# auto-submitted; LIVE_MODE additionally gates real submission (section 37).
dry_run: true
live_mode: false

matching:
  # Matching Engine V2 (forensic false-positive audit) recalibration: the
  # old 90/80/70 thresholds were tuned against the pre-V2 scorer, which
  # routinely inflated overall_score via generic-keyword overlap (see the
  # audit report). Under the corrected, more conservative scoring, a
  # false-positive job (wrong role family, e.g. an unrelated engineering
  # discipline) now caps out around 45 even in its best case, while a
  # genuinely strong, honestly-evidenced match for this candidate's real
  # target roles lands in the high 50s-60s on a realistically detailed
  # posting — verified empirically via tests/unit/test_matching_v2.py and
  # the synthetic benchmark in tests/unit/test_matching_benchmark.py.
  # These thresholds are set with a deliberate safety margin ABOVE the
  # false-positive ceiling (role_family_mismatch caps overall_score at 45
  # in job_agent.matching.scoring — always strictly below save_threshold)
  # so a role-mismatched job can never reach SAVE purely by recalibration.
  auto_apply_threshold: 85
  review_threshold: 65
  save_threshold: 50
  # Below save_threshold -> SKIP
  # How much weight the LLM-based semantic refinement gets vs. the
  # deterministic keyword/regex score, for the three dimensions it refines
  # (role_match, experience_match, project_match). 0.0 = ignore semantic
  # entirely; 1.0 = trust semantic entirely. See job_agent.matching.scoring.
  semantic_blend_weight: 0.4

freshness:
  preferred_hours: 24
  just_posted_hours: 6
  recent_days: 7

priority_weights:
  match: 0.45
  freshness: 0.15
  career_value: 0.15
  company_fit: 0.10
  application_ease: 0.05
  # A bounded nudge from repeated save/apply behavior — see
  # job_agent.candidate.learning / job_agent.matching.ranking.
  behavioral_fit: 0.10

scoring_weights:
  skills: 0.25
  experience: 0.20
  role_alignment: 0.20
  projects: 0.10
  education: 0.10
  location: 0.05
  seniority: 0.05
  eligibility: 0.05

applications:
  max_per_day: 15
  max_per_hour: 5
  max_per_company: 1
  max_per_source_per_day: 10

scheduler:
  job_discovery_minutes: 10
  analytics_daily_hour_utc: 2
  cleanup_daily_hour_utc: 3

llm:
  provider: "anthropic"
  # Cheap/fast model, appropriate for a high-volume matching task (section
  # 40's cost-optimization guidance). Override via LLM_MODEL env var or here.
  model: "claude-haiku-4-5-20251001"
  max_requests_per_minute: 20

# `job-agent applications prepare`'s application-provider selection
# (Phase 6B). "manual_review" is the default and only production provider
# — no real ATS integration exists, submission always requires a human.
# Setting provider to "structured_ats" ADDITIONALLY requires
# structured_ats.enabled: true below (two explicit switches, matching
# dry_run/live_mode's own defense-in-depth posture) before
# StructuredATSProvider is ever constructed, and even then it only ever
# reads LOCAL fixture data from fixture_path — never a network call, never
# a real ATS platform — and its submit() unconditionally refuses regardless
# of any setting here or in dry_run/live_mode. See
# config/fixtures/structured_ats_forms.example.yaml.
application_provider:
  provider: "manual_review"
  structured_ats:
    enabled: false
    fixture_path: "config/fixtures/structured_ats_forms.example.yaml"
