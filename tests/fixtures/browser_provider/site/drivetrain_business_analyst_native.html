<!DOCTYPE html>
<!--
  Phase 6D Stage 2 — the SAME field set as
  drivetrain_business_analyst.html (mirroring only what a human manually
  observed on the real Drivetrain "Business Analyst - Customer Platform"
  Lever posting), rebuilt with ZERO data-field/data-label/data-required
  markers — native <label for>, native required, native input types only.

  This is the direct validation for the gap the Stage 2 compatibility
  report identified: ApplicationFormInspector's generic discovery path
  (see inspector.py) must find the same 7 fields, with the same required
  flags, from this native markup as the data-field version already does
  from the synthetic-marker version. It does not prove the REAL
  jobs.lever.co page's actual markup would be discovered (that markup is
  still unknown — never fetched by this repository), only that ordinary,
  conventional HTML shaped like a real form now works, closing the
  specific limitation that was previously undefined.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetic Test — Drivetrain (native-HTML mirror)</title>
</head>
<body>
  <h1>Drivetrain — Business Analyst - Customer Platform (native-HTML mirror)</h1>

  <form id="application-form" onsubmit="return false;">
    <label for="resume">Resume/CV</label>
    <input type="file" id="resume" name="resume">

    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="current_location">Current location</label>
    <input type="text" id="current_location" name="current_location" required>

    <label for="current_company">Current company</label>
    <input type="text" id="current_company" name="current_company" required>

    <label for="linkedin_url">LinkedIn URL</label>
    <input type="url" id="linkedin_url" name="linkedin_url" required>

    <button type="submit" id="real-submit-button">SUBMIT APPLICATION</button>
  </form>
</body>
</html>
