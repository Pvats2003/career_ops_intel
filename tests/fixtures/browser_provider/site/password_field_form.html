<!DOCTYPE html>
<!--
  Phase 6D — LOCAL SYNTHETIC form used to prove the password-field
  security fix: ApplicationFormInspector must classify <input
  type="password"> as its own "password" input_type (never generic
  "text"), and no component downstream of it may ever read or expose
  its value.

  full_name: ordinary text field — proves normal fields are unaffected.
  account_password: a password field PRE-FILLED via the `value`
    attribute with a synthetic, obviously-fake secret
    ("hunter2-secret-test-only") — simulating a value already present in
    the live DOM (e.g. browser autofill) at inspection time, not
    something this test suite ever types in. The whole point of this
    fixture is to prove that even though a real value IS present in the
    DOM, nothing in this codebase ever reads it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetic Test — Form With a Password Field</title>
</head>
<body>
  <h1>Password Field Form (no synthetic markers)</h1>

  <form id="application-form" onsubmit="return false;">
    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" required>

    <label for="account_password">Create a password</label>
    <input
      type="password"
      id="account_password"
      name="account_password"
      value="hunter2-secret-test-only"
      required
    >

    <button type="submit" id="real-submit-button">Submit Application</button>
  </form>
</body>
</html>
